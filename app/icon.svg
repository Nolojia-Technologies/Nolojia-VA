<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0E2E"/>
      <stop offset="100%" stop-color="#2D2B7F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#BBB9F3" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#4A47C4" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Letter N: left vertical bar -->
  <rect x="7" y="8" width="3.5" height="16" rx="1.75" fill="url(#accent)"/>
  <!-- Letter N: diagonal stroke -->
  <line x1="7" y1="8" x2="21.5" y2="24" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Letter N: right vertical bar -->
  <rect x="21.5" y="8" width="3.5" height="16" rx="1.75" fill="url(#accent)"/>
</svg>
